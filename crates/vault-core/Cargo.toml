[package]
name = "vault-core"
description = "Zero-knowledge encrypted vault: crypto, key hierarchy, item model, search, history, generator, sync, import/export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
hkdf.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
rand_core.workspace = true
rand.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
base64.workspace = true
thiserror.workspace = true

# On wasm32 (web client + browser extensions), `getrandom` 0.2 does not compile
# unless a backend is selected. Enable its `js` feature so `OsRng` uses the
# browser Web Crypto API. Native, iOS, and Android targets are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json.workspace = true
