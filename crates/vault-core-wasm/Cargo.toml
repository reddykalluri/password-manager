[package]
name = "vault-core-wasm"
description = "WASM/TypeScript bindings for vault-core (web client + browser extensions)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# NOTE: intentionally does NOT inherit `[lints] workspace = true`: wasm-bindgen
# generates `unsafe` glue, which the workspace `unsafe_code = "forbid"` lint
# would reject.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vault-core = { path = "../vault-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
base64.workspace = true
rand.workspace = true
# OPAQUE client, ciphersuite must match vault-server exactly.
opaque-ke = { version = "3", features = ["ristretto255"] }
console_error_panic_hook = "0.1"
