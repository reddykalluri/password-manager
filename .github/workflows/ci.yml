name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  audit:
    name: cargo-audit
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Install a prebuilt cargo-audit binary (no from-source compile, which was
      # failing the rustsec/audit-check action), then scan the lockfile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (rsa Marvin attack, no upstream fix) is reachable only
      # via the unused sqlx-mysql driver; ignored explicitly here and documented
      # in .cargo/audit.toml. Remove when a fixed `rsa` ships.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  test:
    name: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  cross-build:
    name: cross-build (${{ matrix.target }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target:
          # WASM crypto target for web client + extensions.
          - wasm32-unknown-unknown
          # Mobile cross-targets for UniFFI bindings.
          - aarch64-linux-android
          - aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # vault-core must compile for every client target; the server does not.
      - run: cargo build -p vault-core --target ${{ matrix.target }}
