<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #2f57d6;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 12px;
        font: 14px/1.4 system-ui, sans-serif;
      }
      h1 {
        font-size: 1rem;
        margin: 0 0 8px;
      }
      input,
      button {
        font: inherit;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin: 4px 0;
        min-height: 40px;
      }
      button {
        min-height: 40px;
        padding: 0 10px;
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
      }
      ul {
        list-style: none;
        margin: 8px 0;
        padding: 0;
        max-height: 260px;
        overflow: auto;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        padding: 6px 4px;
        border-bottom: 1px solid #8883;
      }
      .t {
        display: flex;
        flex-direction: column;
      }
      .u {
        color: #8a8f98;
        font-size: 0.8rem;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .banner {
        background: #2f57d622;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .hidden {
        display: none;
      }
      [aria-live] {
        position: absolute;
        left: -9999px;
      }
    </style>
  </head>
  <body>
    <h1>Vault</h1>
    <div aria-live="polite" id="live"></div>
    <div id="app"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
